<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Element</title>
    <style>
        div {
            background-color: lightblue;
            color: black;
            width: 50%;
            padding: 20px;
            margin: 10px;
            height: 10vh;
        }
        h1{
            background-color: rgb(147, 186, 56);
            color: rgb(153, 56, 56);
            width: 30vw;
            padding: 10px;
            margin: 5px;
        }
        p{
            background-color: lightcoral;
            color: black;
        }
    </style>
</head>
<body>
    <div>
        This is a block-level element.
    </div>
    <p>
        This is a paragraph tag and it is also block-level element
    </p>
    <h1>This is a heading tag and also a block-level element</h1>
</body>
</html>
