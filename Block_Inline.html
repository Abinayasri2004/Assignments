
<!DOCTYPE html>
<html>
<head>
    <title>Block and Inline</title>
    <style>
        div {
            background-color: lightblue;
            padding: 10px;
            margin: 5px;
        }

        span {
            background-color: yellow;
            color: red;
        }
    </style>
</head>
<body>
    <h2>Block-Level Element</h2>
    <div>This is a block element.</div>
    <p>Paragraph Tag</p>
    <h2>Heading Tag</h2>
    <div>This is another block element.</div>


    <h2>Inline Element</h2>
    <span>This is inline.</span>
    <b>Bold Tag</b>
    <i>Italic Tag</i>
    <em>Emphasis Tag</em>
    <u>Underline Tag</u>
    <span>This is another inline.</span>
</body>
</html>
