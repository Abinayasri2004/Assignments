
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>
        #header {
            color: darkgreen;
            text-shadow: 1px 1px lightgray;
            text-align: center;
            font-family: Georgia, serif;
            background-color: lightgreen;
        }

        body {
            background-color: honeydew;
            width: 350px;
            padding: 8px;
            border: 2px solid darkgreen;
        }

        #footer {
            color: darkgreen;
            text-align: center;
            background-color: lightgreen;
        }

        #form {
            text-align: left;
        }

        label {
            font-weight: bold;
            color: darkslategray;
            font-family: Georgia, serif;
        }

        input {
            border: 1px solid seagreen;
            background-color: white;
        }
    </style>
</head>

<body>

    <div id="header">
        <h2>Contact Form</h2>
    </div>

    <br>

    <form>
        <div id="form">

            <label>Personal Details</label>
            <br><br>

            <label for="1name">First Name:</label>
            <input type="text" id="1name" name="1name">
            <br><br>
            <label for="2name">Middle Name:</label>
            <input type="text" id="2name" name="2name">
            <br><br>
            <label for="3name">Last Name:</label>
            <input type="text" id="3name" name="3name">
            <br><br>
            <label for="phno">Phone number:</label>
            <input type="number" id="phno" name="phno" aria-placeholder="1234567890">
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <br><br>

            <label for="eml">Email:</label>
            <input type="email" id="eml" name="eml" required>
            <br><br>

            <label for="course">Course:</label>
            <input type="text" id="course" name="course">
            <br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address">
            <br><br>

            <input type="checkbox" id="ch" name="ch" required>
            <label for="ch">Details are correct</label>
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">

        </div>
    </form>

    <br>

    <div id="footer">
        <h5>www.Contact.com</h5>
        <h5>@Contact</h5>
    </div>

</body>
</html>
